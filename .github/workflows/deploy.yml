name: Build de deploy

# O apply do Terraform é manual (rodado localmente por quem tiver `aws login` na conta) — a
# conta usada neste projeto é da "nova experiência AWS", cuja Service Control Policy nega
# iam:CreateOpenIDConnectProvider, inviabilizando autenticação via OIDC para o GitHub Actions
# (confirmado em apply real; ver docs/deploy.md). Este workflow fica restrito a build/empacotamento,
# que não depende de credenciais AWS — mantém os jars das 3 funções sempre prontos para deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Empacotar as funções Lambda (jars sombreados)
        run: mvn -B -DskipTests package

      - name: Guardar jars das funções
        uses: actions/upload-artifact@v4
        with:
          name: funcoes-lambda
          path: |
            funcao-receber-avaliacao/target/*.jar
            funcao-notificar-urgencia/target/*.jar
            funcao-gerar-relatorio-semanal/target/*.jar
