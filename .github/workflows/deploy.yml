name: Deploy

# Disparo manual apenas (workflow_dispatch): o job de terraform depende do secret AWS_ROLE_ARN,
# que só existe depois do primeiro apply manual (ver docs/deploy.md, Fase 6). Antes disso, deixar
# em push automático só deixaria o commit vermelho sem necessidade. Depois que a conta AWS estiver
# configurada, dá para voltar a disparar em push se o grupo preferir.
on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Aplicar as mudanças de infraestrutura (terraform apply). Sem marcar, roda só o plan."
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Empacotar as funções Lambda (jars sombreados)
        run: mvn -B -DskipTests package

      - name: Guardar jars das funções
        uses: actions/upload-artifact@v4
        with:
          name: funcoes-lambda
          path: |
            funcao-receber-avaliacao/target/*.jar
            funcao-notificar-urgencia/target/*.jar
            funcao-gerar-relatorio-semanal/target/*.jar

  terraform:
    needs: build
    runs-on: ubuntu-latest
    env:
      TF_VAR_email_admin_inicial: ${{ secrets.EMAIL_ADMIN_INICIAL }}
      TF_VAR_email_remetente: ${{ secrets.EMAIL_REMETENTE }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Baixar jars das funções
        uses: actions/download-artifact@v4
        with:
          name: funcoes-lambda

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend-config=backend.hcl

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: github.event.inputs.aplicar == 'true'
        working-directory: infra
        run: terraform apply -auto-approve tfplan
