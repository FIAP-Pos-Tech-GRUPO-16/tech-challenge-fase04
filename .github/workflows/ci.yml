name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes-unitarios:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rodar testes unitários (domínio, aplicação, adapters, handlers)
        run: mvn -B test

  testes-integracao:
    runs-on: ubuntu-latest
    needs: testes-unitarios
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rodar testes de integração contra LocalStack (DynamoDB, EventBridge)
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: mvn -B -pl modulo-infraestrutura -am verify

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Validar sintaxe e formatação (sem credenciais AWS)
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
