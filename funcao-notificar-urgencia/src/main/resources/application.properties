spring.main.web-application-type=none
spring.cloud.function.definition=notificarUrgencia
# Logs em JSON (uma linha por evento), lidos pelo CloudWatch Logs Insights sem parser extra.
logging.structured.format.console=logstash
# O adapter AWS registra o evento recebido inteiro em INFO (inclui a descrição digitada pelo
# estudante); só avisos e erros dele vão para o log.
logging.level.org.springframework.cloud.function.adapter.aws=WARN
