<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 540" width="760" height="540" xmlns="http://www.w3.org/2000/svg" font-family="Charter, Georgia, serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3f47"/>
    </marker>
    <style>
      .caixa { fill:#ffffff; stroke:#222; stroke-width:1; rx:5; }
      .lambda { fill:#fff3e0; stroke:#f0a030; stroke-width:1.3; rx:5; }
      .dados { fill:#ffffff; stroke:#222; stroke-width:1; rx:5; }
      .apoio { fill:#f9e3e9; stroke:#b4143c; stroke-width:1.1; rx:5; }
      .obs { fill:#ffffff; stroke:#777; stroke-width:1; stroke-dasharray:4 3; rx:5; }
      .t { font-size:12.5px; fill:#111; text-anchor:middle; }
      .s { font-size:10.5px; fill:#333; text-anchor:middle; font-family:Menlo, monospace; }
      .l { font-size:9.5px; fill:#333; }
      .f { stroke:#3a3f47; stroke-width:1.2; fill:none; marker-end:url(#seta); }
      .fd { stroke:#3a3f47; stroke-width:1.1; fill:none; stroke-dasharray:4 3; marker-end:url(#seta); }
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="540" fill="#ffffff"/>

  <!-- Linha 1 -->
  <rect class="apoio" x="20" y="20" width="140" height="50"/>
  <text class="t" x="90" y="50">Estudante</text>
  <rect class="caixa" x="220" y="20" width="180" height="50"/>
  <text class="t" x="310" y="42">Amazon Cognito</text>
  <text class="s" x="310" y="58">User Pool</text>
  <path class="f" d="M160,45 L218,45"/>
  <text class="l" x="164" y="38">login / JWT</text>

  <!-- Linha 2 -->
  <rect class="caixa" x="220" y="120" width="180" height="56"/>
  <text class="t" x="310" y="143">API Gateway (HTTP)</text>
  <text class="s" x="310" y="160">JWT Authorizer</text>
  <path class="f" d="M90,70 L90,148 L218,148"/>
  <text class="l" x="96" y="140">POST /avaliacao</text>
  <rect class="lambda" x="450" y="120" width="180" height="56"/>
  <text class="t" x="540" y="143">Lambda</text>
  <text class="s" x="540" y="160">receber-avaliacao</text>
  <path class="f" d="M400,148 L448,148"/>
  <text class="l" x="404" y="141">invoca</text>

  <rect class="obs" x="650" y="20" width="100" height="74"/>
  <text class="t" x="700" y="44">CloudWatch</text>
  <text class="s" x="700" y="60">logs · dashboard</text>
  <text class="s" x="700" y="74">alarmes → SNS</text>
  <text class="s" x="700" y="88">(todas as funções)</text>

  <!-- Linha 3 -->
  <rect class="dados" x="220" y="235" width="180" height="50"/>
  <text class="t" x="310" y="257">DynamoDB</text>
  <text class="s" x="310" y="273">avaliacoes + GSI por data</text>
  <path class="f" d="M480,176 L380,233"/>
  <text class="l" x="400" y="200">grava</text>
  <rect class="caixa" x="450" y="235" width="180" height="50"/>
  <text class="t" x="540" y="257">EventBridge</text>
  <text class="s" x="540" y="273">barramento próprio</text>
  <path class="f" d="M540,176 L540,233"/>
  <text class="l" x="546" y="210">AvaliacaoRecebida</text>

  <!-- Linha 4 -->
  <rect class="caixa" x="20" y="350" width="140" height="56"/>
  <text class="t" x="90" y="373">EventBridge</text>
  <text class="s" x="90" y="390">Scheduler (seg. 08h)</text>
  <rect class="lambda" x="220" y="350" width="180" height="56"/>
  <text class="t" x="310" y="373">Lambda</text>
  <text class="s" x="310" y="390">gerar-relatorio-semanal</text>
  <path class="f" d="M160,378 L218,378"/>
  <text class="l" x="166" y="370">semanal</text>
  <path class="f" d="M310,350 L310,287"/>
  <text class="l" x="316" y="325">consulta (Query)</text>
  <rect class="lambda" x="450" y="350" width="180" height="56"/>
  <text class="t" x="540" y="373">Lambda</text>
  <text class="s" x="540" y="390">notificar-urgencia</text>
  <path class="f" d="M540,285 L540,348"/>
  <text class="l" x="546" y="320">nivelUrgencia = ALTA</text>

  <rect class="dados" x="650" y="350" width="100" height="56"/>
  <text class="t" x="700" y="373">SQS</text>
  <text class="s" x="700" y="390">DLQs</text>
  <path class="fd" d="M630,392 L648,392"/>
  <text class="l" x="656" y="424">falhas de entrega</text>
  <text class="l" x="656" y="437">e de execução</text>

  <!-- Linha 5 -->
  <rect class="caixa" x="220" y="470" width="180" height="50"/>
  <text class="t" x="310" y="492">Amazon SES</text>
  <text class="s" x="310" y="508">e-mail do administrador</text>
  <path class="f" d="M290,406 L290,468"/>
  <text class="l" x="232" y="440">relatório</text>
  <path class="f" d="M500,406 L380,468"/>
  <text class="l" x="440" y="430">alerta</text>
  <rect class="dados" x="450" y="470" width="180" height="50"/>
  <text class="t" x="540" y="492">SSM Parameter Store</text>
  <text class="s" x="540" y="508">e-mail do administrador</text>
  <path class="fd" d="M580,406 L580,468"/>
  <path class="fd" d="M340,406 Q 420,452 448,488"/>
  <text class="l" x="586" y="445">lê destinatário</text>
</svg>
